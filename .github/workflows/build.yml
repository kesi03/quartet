name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Zig 0.13.0
        shell: bash
        run: |
          curl -fsSLo zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xf zig.tar.xz
          echo "$GITHUB_WORKSPACE/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Fetch Vibe SDK
        shell: bash
        run: sh scripts/fetch-sdk.sh

      - name: Regenerate demo, chords icon
        shell: bash
        run: |
          python3 tools/make_demo.py
          python3 tools/make_icon.py

      - name: Build firmware
        shell: bash
        run: sh sdk/tools/build.sh ../firmware/quartet

      - name: Validate firmware
        shell: bash
        run: |
          node sdk/tools/vibe-check.mjs sdk/build/quartet.wasm --manifest firmware/quartet/firmware.json
          node sdk/tools/wasmtest.mjs sdk/build/quartet.wasm firmware/quartet/wasmtest.json out/
          node sdk/tools/wasmtest.mjs sdk/build/quartet.wasm firmware/quartet/wasmtest-midi.json out-midi/
          node sdk/tools/wasmtest.mjs sdk/build/quartet.wasm firmware/quartet/wasmtest-chords.json out-chords/
